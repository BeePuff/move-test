<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Dash 3D</title>
<style>
body { margin:0; overflow:hidden; background:black; font-family:Arial; }
#menu, #death {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  background:rgba(0,0,0,.85); color:#0ff;
}
button {
  padding:12px 28px;
  font-size:18px;
  background:#0ff;
  border:none;
  cursor:pointer;
}
#hud {
  position:absolute;
  top:10px; left:10px;
  color:#0ff;
}
</style>
</head>
<body>

<div id="menu">
  <h1>NEON DASH 3D</h1>
  <button onclick="startGame()">PLAY</button>
</div>

<div id="death" style="display:none">
  <h1>YOU DIED</h1>
  <button onclick="restart()">RESTART</button>
</div>

<div id="hud">
  <div id="score">Score: 0</div>
  <div id="hp">HP: 100</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ================= SETUP ================= */
let scene, camera, renderer;
let player, bullets=[], enemies=[];
let keys={}, mouse={x:0,y:0};
let score=0, hp=100;
let state="menu";

addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
});

/* ================= INIT ================= */
function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x000000);

  camera=new THREE.PerspectiveCamera(
    75, innerWidth/innerHeight, 0.1, 1000
  );
  camera.position.set(0,20,25);
  camera.lookAt(0,0,0);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);

  const light=new THREE.PointLight(0x00ffff,2,200);
  light.position.set(0,30,10);
  scene.add(light);

  const floor=new THREE.Mesh(
    new THREE.PlaneGeometry(200,200),
    new THREE.MeshStandardMaterial({color:0x050505})
  );
  floor.rotation.x=-Math.PI/2;
  scene.add(floor);

  player=new THREE.Mesh(
    new THREE.SphereGeometry(1.2,16,16),
    new THREE.MeshStandardMaterial({color:0x00ffff})
  );
  player.position.y=1.2;
  scene.add(player);

  for(let i=0;i<6;i++) spawnEnemy();

  animate();
}

/* ================= GAME FLOW ================= */
function startGame(){
  document.getElementById("menu").style.display="none";
  state="game";
}

function restart(){
  location.reload();
}

/* ================= SPAWN ================= */
function spawnEnemy(){
  const e=new THREE.Mesh(
    new THREE.BoxGeometry(2,2,2),
    new THREE.MeshStandardMaterial({color:0xff00ff})
  );
  e.position.set(
    (Math.random()-0.5)*80,
    1,
    (Math.random()-0.5)*80
  );
  e.userData={hp:60};
  scene.add(e);
  enemies.push(e);
}

/* ================= SHOOT ================= */
function shoot(){
  const ray=new THREE.Raycaster();
  ray.setFromCamera(mouse,camera);

  const b=new THREE.Mesh(
    new THREE.SphereGeometry(0.3,8,8),
    new THREE.MeshStandardMaterial({color:0xffffff})
  );
  b.position.copy(player.position);
  b.userData.vel=ray.ray.direction.clone().multiplyScalar(1.2);
  scene.add(b);
  bullets.push(b);
}

/* ================= UPDATE ================= */
let lastShot=0;
function update(){
  if(state!=="game") return;

  const speed=0.4;
  if(keys.w) player.position.z-=speed;
  if(keys.s) player.position.z+=speed;
  if(keys.a) player.position.x-=speed;
  if(keys.d) player.position.x+=speed;

  camera.position.x=player.position.x;
  camera.position.z=player.position.z+25;

  const now=Date.now();
  if(now-lastShot>250){
    shoot();
    lastShot=now;
  }

  bullets.forEach((b,bi)=>{
    b.position.add(b.userData.vel);
    enemies.forEach((e,ei)=>{
      if(b.position.distanceTo(e.position)<1.5){
        e.userData.hp-=20;
        scene.remove(b);
        bullets.splice(bi,1);
        if(e.userData.hp<=0){
          scene.remove(e);
          enemies.splice(ei,1);
          score+=10;
          document.getElementById("score").textContent="Score: "+score;
          spawnEnemy();
        }
      }
    });
  });

  enemies.forEach(e=>{
    const dir=player.position.clone().sub(e.position).normalize();
    e.position.add(dir.multiplyScalar(0.05));
    if(e.position.distanceTo(player.position)<1.5){
      hp-=0.4;
      document.getElementById("hp").textContent="HP: "+Math.max(0,hp|0);
      if(hp<=0){
        state="dead";
        document.getElementById("death").style.display="flex";
      }
    }
  });
}

/* ================= LOOP ================= */
function animate(){
  requestAnimationFrame(animate);
  update();
  renderer.render(scene,camera);
}

init();
</script>
</body>
</html>
